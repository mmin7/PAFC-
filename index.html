<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PAFC 통합 관리 시스템</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    background: #f0f4f8;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    width: 100%;
    overflow: hidden;
  }

  header {
    background: #185FA5;
    color: #fff;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
    z-index: 10;
  }
  header h1 {
    font-size: 1.05rem;
    font-weight: 700;
    white-space: nowrap;
  }

  .tabs {
    display: flex;
    gap: 6px;
    flex: 1;
  }
  .tab-btn {
    flex: 0 0 auto;
    padding: 9px 22px;
    border: none;
    border-radius: 8px;
    background: rgba(255,255,255,.12);
    color: #E6F1FB;
    font-size: .9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tab-btn:hover { background: rgba(255,255,255,.22); }
  .tab-btn.active { background: #fff; color: #185FA5; }
  @media (max-width: 600px) {
    header { padding: 8px 8px; gap: 8px; }
    header h1 { display: none; }
    .tabs { gap: 6px; min-width: 0; }
    .tab-btn {
      flex: 1 1 0;
      min-width: 0;
      justify-content: center;
      padding: 10px 6px;
      font-size: .85rem;
      white-space: nowrap;
    }
    .tab-btn .dot { display: none; }
  }
  .tab-btn .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: currentColor; opacity: .5;
  }
  .tab-btn.active .dot { opacity: 1; }

  main {
    flex: 1;
    position: relative;
    min-height: 0;
  }

  iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: #fff;
    display: none;
  }
  iframe.active { display: block; }

  .loading {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    font-size: .9rem;
    pointer-events: none;
  }
</style>
</head>
<body>

  <header>
    <h1>📊 PAFC 통합 관리</h1>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="trip" onclick="switchTab('trip')">
        <span class="dot"></span> 출장 관리 시스템
      </button>
      <button class="tab-btn" data-tab="stock" onclick="switchTab('stock')">
        <span class="dot"></span> 재고 관리 시스템
      </button>
    </nav>
  </header>

  <main>
    <div class="loading" id="loading">불러오는 중...</div>
    <iframe id="frame-trip" class="active" src="trip.html" title="출장 관리 시스템"></iframe>
    <iframe id="frame-stock" src="stock.html" title="재고 관리 시스템"></iframe>
  </main>

  <script>
    let loaded = { trip: false, stock: false };

    function checkLoaded(name) {
      loaded[name] = true;
      const loading = document.getElementById('loading');
      if (loaded.trip || loaded.stock) loading.style.display = 'none';
    }
    document.getElementById('frame-trip').addEventListener('load', () => checkLoaded('trip'));
    document.getElementById('frame-stock').addEventListener('load', () => checkLoaded('stock'));

    function switchTab(name) {
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.tab === name);
      });
      document.getElementById('frame-trip').classList.toggle('active', name === 'trip');
      document.getElementById('frame-stock').classList.toggle('active', name === 'stock');
    }
  </script>

</body>
</html>
